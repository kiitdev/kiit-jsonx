build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

style:
  MagicNumber:
    active: false        # source positions/offsets are named concepts, not magic numbers
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: true
  ReturnCount:
    max: 6               # guard-clause early returns are idiomatic; default of 2 is too strict
  ForbiddenComment:
    active: false        # TODOs in KDoc are used as design notes, not untracked work

complexity:
  TooManyFunctions:
    thresholdInClasses: 20   # a lexer needs one small, focused read-helper per grammar rule
    thresholdInFiles: 30     # the extraction API is one function per type x suffix, by design
